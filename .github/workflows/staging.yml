name: Build and deploy staging

on:
  push:
    branches:
      - main
      - "release/**"

permissions:
  actions: read
  contents: read

concurrency:
  group: cafe77-staging
  cancel-in-progress: false

jobs:
  build-test-deploy:
    name: Build, test, and deploy staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run application tests
        run: npm test

      - name: Run Workers and D1 tests
        run: npm run test:workers

      - name: Save tested frontend build
        uses: actions/upload-artifact@v4
        with:
          name: cafe77-frontend-dist
          path: dist/
          if-no-files-found: error

      - name: Apply staging D1 migrations
        run: npx wrangler d1 migrations apply DB --env staging --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy staging Worker and assets
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
